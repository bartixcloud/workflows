# Copy to .github/dependabot.yml in a caller repo. Keep github-actions, keep only
# the ecosystems the repo uses, and fix each directory to where its manifest is.
# Dependabot updates the SHA and the "# vX.Y.Z" comment next to it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [deps]

  # Repo ecosystems (examples; delete what does not apply):
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    labels: [deps]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    labels: [deps]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    labels: [deps]
